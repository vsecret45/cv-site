<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion securisee...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0e1220;
      color: #f8fafc;
      font: 500 16px/1.5 Arial, sans-serif;
    }

    .auth-callback-status {
      text-align: center;
      padding: 24px 28px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }
  </style>
</head>
<body>
  <div class="auth-callback-status">Connexion securisee en cours...</div>
  <script>
    (() => {
      const isLocalHost = /^(localhost|127\.0\.0\.1|0\.0\.0\.0)$/.test(window.location.hostname);
      const origin = isLocalHost ? window.location.origin : 'https://sacreationweb.com';
      const destination = new URL('/cv.html', origin);
      const currentUrl = new URL(window.location.href);

      currentUrl.searchParams.forEach((value, key) => {
        destination.searchParams.set(key, value);
      });

      destination.searchParams.set('auth_callback', '1');
      destination.hash = window.location.hash || '';

      window.location.replace(destination.toString());
    })();
  </script>
</body>
</html>
