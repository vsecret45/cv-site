<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Parametres du compte SA Creation Web : connexion, securite, deconnexion et suppression du compte."
    >
    <title>SA Création Web | Paramètres du compte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="style.css?v=20260704-auth-controls-v3">
</head>
<body class="is-preload studio-home">
    <canvas class="cosmic-page-field" id="cosmic-page-field" aria-hidden="true"></canvas>
    <div class="cosmic-page-glow" aria-hidden="true"></div>
    <div class="page-shell">
        <header class="hero hero-studio hero-immersive" id="top">
            <canvas class="hero-particles" id="hero-particles" aria-hidden="true"></canvas>
            <div class="hero-ambient" aria-hidden="true"></div>
            <nav class="topbar" aria-label="Navigation principale">
                <a class="brand" href="index.html">SA Création Web</a>
                <button class="couture-menu-toggle" id="site-menu-toggle" type="button" aria-label="Ouvrir le menu" aria-controls="site-menu-panel" aria-expanded="false">
                    <span class="menu-glyph" aria-hidden="true"><i></i><i></i></span>
                    <span class="sr-only">Menu</span>
                </button>
                <div class="site-menu-panel" id="site-menu-panel">
                    <div class="site-menu-links">
                        <a href="index.html">Accueil</a>
                        <a href="prestations.html">Prestations</a>
                        <a href="contact.html">Contact</a>
                        <a href="cv.html">CV & Portfolio</a>
                        <a href="parametres.html" aria-current="page">Parametres</a>
                    </div>
                    <div class="site-menu-actions auth-actions" id="auth-actions">
                        <span class="auth-badge is-hidden" id="auth-current-user"></span>
                        <p class="site-menu-subtitle">Espace client</p>
                        <button type="button" id="auth-open-login">Connexion</button>
                        <button type="button" id="auth-open-signup">Creer un compte</button>
                        <a class="is-hidden" href="cv.html" id="auth-client-link">Mon espace client</a>
                        <a class="is-hidden" href="parametres.html" id="auth-settings-link">Parametres</a>
                        <button class="is-hidden" type="button" id="auth-logout">Deconnexion</button>
                        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Basculer entre mode nuit et mode jour" aria-pressed="false">
                            <span class="theme-toggle-dot"></span>
                            <span class="theme-toggle-text">Jour</span>
                        </button>
                    </div>
                </div>
            </nav>

            <div class="studio-hero-grid">
                <div class="hero-content">
                <p class="eyebrow hero-reveal hero-reveal-delay-1">Parametres</p>
                <h1 class="hero-title hero-reveal-delay-2">
                    <span class="title-line">Mon compte</span>
                </h1>
                </div>
            </div>
        </header>

        <main id="main-content">
            <section class="section reveal-section">
                <div class="section-heading">
                    <p class="section-kicker">Paramètres</p>
                    <h2>Mon compte</h2>
                </div>
                <div class="ai-brief-panel builder-workspace creator-studio">
                    <article class="ai-brief-output">
                        <div class="creator-form-head">
                            <h3 id="settings-account-title">Mon compte</h3>
                            <p id="settings-account-copy">Connectez-vous pour acceder a votre compte.</p>
                        </div>
                        <div class="advisor-composer-actions">
                            <button class="button button-primary" type="button" id="settings-open-login">Connexion</button>
                            <button class="button button-secondary" type="button" id="settings-open-signup">Creer un compte</button>
                            <button class="button button-secondary is-hidden" type="button" id="settings-logout">Deconnexion</button>
                        </div>
                        <div class="assistant-proposal-details is-hidden" id="settings-danger-zone">
                            <button class="button button-secondary" type="button" id="settings-delete-account">Supprimer mon compte</button>
                        </div>
                        <p class="auth-feedback" id="settings-feedback" aria-live="polite"></p>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <section class="auth-modal is-hidden" id="auth-modal" aria-hidden="true">
        <div class="auth-modal-backdrop" data-auth-close></div>
        <div class="auth-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
            <button class="auth-modal-close" id="auth-close" type="button" aria-label="Fermer">×</button>
                    <h2 id="auth-modal-title">Connexion</h2>
                    <p class="auth-modal-text">Accedez a votre compte.</p>
            <div class="auth-modal-tabs" role="tablist" aria-label="Connexion securisee">
                <button class="auth-tab is-active" type="button" data-auth-view="login" aria-selected="true">Connexion</button>
                <button class="auth-tab" type="button" data-auth-view="signup" aria-selected="false">Creer un compte</button>
            </div>
            <div class="auth-modal-panel" id="auth-panel-login">
                <form class="auth-form" id="auth-login-form">
                    <label class="field">
                        <span>Email</span>
                        <input type="email" name="email" placeholder="email@exemple.com" required>
                    </label>
                    <label class="field">
                        <span>Mot de passe</span>
                        <span class="password-field">
                            <input type="password" name="password" placeholder="Votre mot de passe" required>
                            <button type="button" data-password-toggle aria-label="Afficher le mot de passe">Afficher</button>
                        </span>
                    </label>
                    <button class="button button-primary" type="submit">Me connecter</button>
                </form>
            </div>
            <div class="auth-modal-panel is-hidden" id="auth-panel-signup">
                <form class="auth-form" id="auth-signup-form">
                    <label class="field">
                        <span>Nom</span>
                        <input type="text" name="name" placeholder="Votre nom" required>
                    </label>
                    <label class="field">
                        <span>Email</span>
                        <input type="email" name="email" placeholder="email@exemple.com" required>
                    </label>
                    <label class="field">
                        <span>Mot de passe</span>
                        <span class="password-field">
                            <input type="password" name="password" placeholder="Choisir un mot de passe" required>
                            <button type="button" data-password-toggle aria-label="Afficher le mot de passe">Afficher</button>
                        </span>
                    </label>
                    <label class="field">
                        <span>Confirmer le mot de passe</span>
                        <span class="password-field">
                            <input type="password" name="confirmPassword" placeholder="Retaper le mot de passe" required>
                            <button type="button" data-password-toggle aria-label="Afficher le mot de passe">Afficher</button>
                        </span>
                    </label>
                    <button class="button button-primary" type="submit">Creer mon compte</button>
                </form>
            </div>
            <p class="auth-feedback" id="auth-feedback" aria-live="polite"></p>
        </div>
    </section>

    <script src="script.js?v=20260704-auth-controls-v2" defer></script>
</body>
</html>
