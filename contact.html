<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacter SA Création Web pour demander un site vitrine ou une page professionnelle.">
    <title>Contact | SA Création Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="style.css?v=20260614-platform-v17">
    <style>
        .contact-simple-layout {
            width: min(100%, 760px);
            margin: 0 auto;
        }

        .contact-simple-form {
            gap: 0.9rem;
            padding: clamp(1.2rem, 2.4vw, 1.8rem);
            border-radius: 22px;
        }

        .contact-project-field textarea {
            min-height: 13rem;
        }
    </style>
</head>
<body class="is-preload studio-home">
    <div class="page-shell">
        <header class="page-header" id="top">
            <nav class="topbar" aria-label="Navigation principale">
                <a class="brand" href="index.html">SA Création Web</a>
                <button class="couture-menu-toggle" id="site-menu-toggle" type="button" aria-label="Ouvrir le menu" aria-controls="site-menu-panel" aria-expanded="false">
                    <span class="menu-glyph" aria-hidden="true"><i></i><i></i></span>
                    <span class="sr-only">Menu</span>
                </button>
                <div class="site-menu-panel" id="site-menu-panel">
                    <div class="site-menu-links">
                        <a href="index.html">Accueil</a>
                        <a href="prestations.html">Prestations</a>
                        <a href="methode.html">Methode</a>
                        <a href="realisations.html">Exemples</a>
                        <a href="contact.html">Contact</a>
                        <a href="cv.html">CV & Portfolio</a>
                    </div>
                    <div class="site-menu-actions">
                        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Basculer entre mode nuit et mode jour" aria-pressed="false">
                            <span class="theme-toggle-dot"></span>
                            <span class="theme-toggle-text">Jour</span>
                        </button>
                        <a href="prestations.html">Voir les offres</a>
                        <a href="contact.html">Contact</a>
                    </div>
                </div>
            </nav>
            <div class="page-intro">
                <p class="eyebrow">Contact</p>
                <h1>Parlons de votre projet.</h1>
            </div>
        </header>

        <main>
            <section class="section section-contact reveal-section">
                <div class="contact-simple-layout">
                    <form class="contact-form contact-simple-form" id="contact-form">
                        <input type="hidden" name="service" value="Projet site web">
                        <label class="field">
                            <span>Nom</span>
                            <input type="text" name="name" placeholder="Votre nom" autocomplete="name" required>
                        </label>
                        <label class="field">
                            <span>E-mail</span>
                            <input type="email" name="email" placeholder="votre@email.com" autocomplete="email" required>
                        </label>
                        <label class="field">
                            <span>Telephone facultatif</span>
                            <input type="tel" name="phone" placeholder="07 00 00 00 00" autocomplete="tel">
                        </label>
                        <label class="field contact-project-field">
                            <span>Décrivez votre projet</span>
                            <textarea name="project" placeholder="Décrivez librement votre vision..." required></textarea>
                            <p class="field-hint">Expliquez votre activité, ce que vous souhaitez créer et le résultat attendu.</p>
                        </label>
                        <button class="button button-primary contact-button" type="submit">Envoyer ma demande</button>
                        <p class="contact-form-status" id="contact-form-status" aria-live="polite"></p>
                    </form>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <p>SA Création Web</p>
            <p>Contact projet web</p>
        </footer>
    </div>
    <script src="script.js?v=20260614-platform-v17" defer></script>
</body>
</html>
